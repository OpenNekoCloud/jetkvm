name: build
on:
  workflow_dispatch:
    inputs:
      BUILDKIT_VERSION:
        description: "Select buildkit version"
        required: true
        type: choice
        default: "rockchip830"
        options:
          - rockchip830
          - rockchip831

env:
  TZ: Asia/Shanghai

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Prepare Docker build context
        run: ./scripts/ci_helper.sh prepare
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: ${{ env.DOCKER_BUILD_CONTEXT_DIR }}
          file: ${{ env.DOCKER_BUILD_CONTEXT_DIR }}/Dockerfile.build
          tags: ${{ env.DOCKER_BUILD_TAG }}
          push: false
          load: true
          build-args: BUILDKIT_VERSION=${{ inputs.BUILDKIT_VERSION }}
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: "**/package-lock.json"
      - uses: actions/setup-go@v6
        with:
          go-version: "^1.25.1"
      - name: Build frontend
        run: make frontend
      - name: Build application
        run: ./scripts/ci_helper.sh make build_dev
      - name: Run tests
        run: go test ./... -json > testreport.json
      - uses: becheran/go-testreport@v0.3.2
        with:
          input: testreport.json
      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: jetkvm-app
          path: bin/jetkvm_app
